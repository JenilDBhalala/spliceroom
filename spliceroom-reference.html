<title>Spliceroom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=Bebas+Neue&family=Cinzel:wght@700&family=Montserrat:wght@800;900&display=swap">
<style>
/* Layout: toolbar across the top; stage (big 4:5 preview + slide strip) left, slide editor right; stacks under 900px */
:root{
  --bg:#0d0f0d; --panel:#141714; --raise:#1c201c; --line:#2a302a; --fg:#e7ece6; --muted:#8e978d;
  --accent:#bafeb8; --on-accent:#0b1a0c; --danger:#ff9483;
  --ui:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Anton','Impact','Arial Narrow',sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--ui)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg)}
.mark{font:400 30px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.mark i{width:12px;height:12px;border-radius:50%;background:var(--accent);display:inline-block}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{background:none;border:1px solid transparent;border-radius:999px;padding:7px 14px;cursor:pointer;color:var(--muted);font-weight:600}
.tab:hover{color:var(--fg);border-color:var(--line)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:none}
.btn.small{padding:5px 10px;font-size:12.5px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;overflow:auto;min-width:0}
.preview{width:min(100%,calc((100vh - 250px) * .8),560px);min-width:min(100%,280px);aspect-ratio:4/5;max-width:100%;position:relative;border-radius:6px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.55);background:#000}
.preview canvas{width:100%;height:100%;display:block;touch-action:none}
.preview.grab canvas{cursor:grab}
.preview.dragging canvas{cursor:grabbing}
.hint{color:var(--muted);font-size:12.5px;text-align:center}
.strip{display:flex;gap:10px;overflow-x:auto;max-width:100%;padding:4px 4px 8px}
.thumb{flex:none;display:flex;flex-direction:column;gap:5px;align-items:center;background:none;border:0;padding:0;cursor:pointer}
.thumb canvas{width:76px;height:95px;border-radius:4px;display:block;background:#000}
.thumb[aria-current="true"] canvas{outline:2px solid var(--accent);outline-offset:2px}
.thumb span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.add{flex:none;width:76px;height:95px;border:1.5px dashed var(--line);border-radius:4px;background:none;color:var(--muted);cursor:pointer;font-size:12px;font-weight:600;padding:6px}
.add:hover{color:var(--accent);border-color:var(--accent)}
aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding-block:20px 40px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;min-width:0}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ph h2{margin:0;font:400 24px/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.ph small{color:var(--muted);font-variant-numeric:tabular-nums}
.group{display:flex;flex-direction:column;gap:14px;padding-top:16px;border-top:1px solid var(--line)}
.group > h3{margin:0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label,.lbl{font-size:12px;font-weight:600;color:var(--fg)}
.field .tip{font-size:12px;color:var(--muted)}
.field input[type=text],.field textarea,.field select{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:90px;line-height:1.4}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .field{flex:1 1 90px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;font-weight:500}
.switch input{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--fg);transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(16px);background:var(--on-accent)}
.slot{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:10px}
.slot.over{border-color:var(--accent)}
.slot .pic{width:64px;height:64px;border-radius:6px;border:0;padding:0;cursor:pointer;background:repeating-conic-gradient(#232823 0 25%,#1a1e1a 0 50%) 0 0/12px 12px;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:22px}
.slot .pic img{width:100%;height:100%;object-fit:cover}
.slot.contain .pic img{object-fit:contain}
.slot .meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.slot .meta b{font-size:12.5px}
.slot .meta small{color:var(--muted);font-size:11.5px}
.slot .acts{display:flex;gap:6px;flex-wrap:wrap}
.zoom{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.zoom input{flex:1;accent-color:var(--accent);min-width:0}
.colorrow{display:flex;gap:8px;align-items:center}
.colorrow input[type=color]{width:42px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--raise);padding:3px;cursor:pointer}
.colorrow input[type=text]{flex:1}
fieldset{border:1px solid var(--line);border-radius:12px;padding:12px;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
legend{padding:0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.note{color:var(--muted);font-size:12.5px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:20;max-width:calc(100% - 32px)}
@media (max-width:900px){
  .app{height:auto;min-height:100%}
  main{grid-template-columns:minmax(0,1fr)}
  aside{border-left:0;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .stage{padding-right:max(16px,env(safe-area-inset-right,0px))}
  .preview{width:min(100%,480px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <div class="mark"><i></i>Spliceroom</div>
    <nav class="tabs" role="tablist" aria-label="Post format" id="tabs"></nav>
    <div class="spacer"></div>
    <button class="btn ghost" id="brandBtn" type="button">Brand &amp; profile</button>
    <button class="btn primary" id="saveAll" type="button">Download post</button>
  </header>
  <main>
    <section class="stage">
      <div class="preview" id="preview"><canvas id="main" width="1080" height="1350" aria-label="Slide preview"></canvas></div>
      <p class="hint" id="hint">Drag a photo on the preview to reposition it. Scroll on it to zoom. Paste an image with Ctrl+V.</p>
      <div class="strip" id="strip"></div>
    </section>
    <aside id="panel" aria-live="polite"></aside>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const W = 1080, H = 1350;
const $ = s => document.querySelector(s);
const STORE_KEY = 'spliceroom.brand.v1';

/* ---------- placeholder stills (so the tool opens in a working state) ---------- */
const PH_HUES = [[18,200],[265,20],[200,35],[340,190],[40,220],[150,300],[220,10],[0,45]];
function makePH(seed, label){
  const c = document.createElement('canvas'); c.width = 1200; c.height = 1500;
  const g = c.getContext('2d'); const [a,b] = PH_HUES[seed % PH_HUES.length];
  const lg = g.createLinearGradient(0,0,1200,1500);
  lg.addColorStop(0,`hsl(${a} 35% 18%)`); lg.addColorStop(1,`hsl(${b} 30% 9%)`);
  g.fillStyle = lg; g.fillRect(0,0,1200,1500);
  const glow = (x,y,r,h,al) => { const rg = g.createRadialGradient(x,y,0,x,y,r); rg.addColorStop(0,`hsla(${h} 70% 60% / ${al})`); rg.addColorStop(1,`hsla(${h} 70% 50% / 0)`); g.fillStyle = rg; g.fillRect(0,0,1200,1500); };
  glow(300 + (seed*137)%600, 350 + (seed*91)%400, 700, a, .45);
  glow(900 - (seed*53)%500, 1000, 600, b, .3);
  // silhouette
  g.fillStyle = 'rgba(0,0,0,.45)';
  const cx = 420 + (seed*173)%380;
  g.beginPath(); g.arc(cx, 620, 150, 0, Math.PI*2); g.fill();
  g.beginPath(); g.moveTo(cx-330,1500); g.quadraticCurveTo(cx-300,820,cx,800); g.quadraticCurveTo(cx+300,820,cx+330,1500); g.fill();
  const img = g.getImageData(0,0,1200,1500), d = img.data;
  for (let i=0;i<d.length;i+=4){ const n=(Math.random()-.5)*22; d[i]+=n; d[i+1]+=n; d[i+2]+=n; }
  g.putImageData(img,0,0);
  g.fillStyle = 'rgba(255,255,255,.55)'; g.textAlign = 'center';
  g.font = '700 34px Archivo, sans-serif'; g.fillText('DROP A STILL HERE', 600, 330);
  g.font = '500 28px Archivo, sans-serif'; g.fillStyle = 'rgba(255,255,255,.35)'; g.fillText(label || '', 600, 375);
  return c;
}
let phSeed = 0;
const slot = (label, opts={}) => ({ img:null, src:null, ph: opts.noPH ? null : makePH(phSeed++, label), zoom:1, ox:0, oy:0, contain: !!opts.contain });
const adjOf = s => ({ zoom:1, ox:0, oy:0, srcSlot:s });
const imgOf = s => { const base = s.srcSlot || s; return base.img || base.ph; };

/* ---------- state ---------- */
const brand = {
  name:'yourpage', logo: slot('logo',{noPH:true,contain:true}), accent:'#bafeb8',
  avatar: slot('avatar',{noPH:true}), display:'YOURPAGE', verified:true,
  posts:'1,240', followers:'86.4K', following:'112',
  bio:'▷ Daily cinema news, lists and trivia\n✉ hello@yourpage.com\n⇩ New post every day',
  link:'linktr.ee/yourpage',
  cta:'If you love movies and want to keep up with the latest cinema news, you should follow us right now'
};
const P = {
  headline:{ img: slot('photo'), text:"David Fincher hid a Starbucks cup in *almost every scene* of Fight Club.", logo:true, swipe:true, clean:true },
  list:{ panels:[slot('panel 1'),slot('panel 2'),slot('panel 3')], panelCount:3, text:'Every major video game adaptation', swipe:true, follow:false,
    items:[
      {img:slot('movie 1'), logo:slot('title logo',{noPH:true,contain:true}), title:'Fallout', font:'Montserrat', color:'#ffffff', rating:'8.3', showRating:true},
      {img:slot('movie 2'), logo:slot('title logo',{noPH:true,contain:true}), title:'THE LAST OF US', font:'Bebas Neue', color:'#ffffff', rating:'8.6', showRating:true},
      {img:slot('movie 3'), logo:slot('title logo',{noPH:true,contain:true}), title:'Warcraft', font:'Cinzel', color:'#d9d9d9', rating:'6.7', showRating:true},
    ]},
  news:{ img: slot('cover photo'), inset: slot('inset photo'), insetOn:true, text:'The Odyssey\nwas shot entirely\non IMAX\nfilm cameras', swipe:true, follow:true,
    stories:[
      {img:slot('story 1'), text:'Christopher Nolan shot every scene with IMAX 70mm film cameras.\n\nNo feature film had been made that way before.'},
      {img:slot('story 2'), text:'"*It was the only way* to put the audience inside the myth."\n\nNolan, on choosing the format.'},
    ]},
  timeline:{ rows:[
      {img:slot('row 1'), logo:slot('title logo',{noPH:true,contain:true}), title:'The Mummy', year:'1999'},
      {img:slot('row 2'), logo:slot('title logo',{noPH:true,contain:true}), title:'The Mummy Returns', year:'2001'},
      {img:slot('row 3'), logo:slot('title logo',{noPH:true,contain:true}), title:'Tomb of the Dragon Emperor', year:'2008'},
      {img:slot('row 4'), logo:slot('title logo',{noPH:true,contain:true}), title:'The Mummy', year:'2027'},
    ]},
  follow:{}
};
P.headline.cleanAdj = adjOf(P.headline.img);

const FORMATS = [
  {id:'headline', name:'Headline'},
  {id:'list', name:'List'},
  {id:'news', name:'News story'},
  {id:'timeline', name:'Timeline'},
  {id:'follow', name:'Follow card'},
];
let fmt = 'headline', sel = 0, mode = 'slide', activeSlot = null, regions = [];

function slidesFor(f = fmt){
  const p = P[f];
  if (f === 'headline') return [{kind:'hlCover', label:'Cover'}, ...(p.clean ? [{kind:'hlClean', label:'Photo'}] : [])];
  if (f === 'list') return [{kind:'listCover', label:'Cover'}, ...p.items.map((it,i)=>({kind:'listItem', i, label:it.title||`Movie ${i+1}`})), ...(p.follow?[{kind:'follow',label:'Follow'}]:[])];
  if (f === 'news') return [{kind:'newsCover', label:'Cover'}, ...p.stories.map((s,i)=>({kind:'newsStory', i, label:`Story ${i+1}`})), ...(p.follow?[{kind:'follow',label:'Follow'}]:[])];
  if (f === 'timeline') return [{kind:'timeline', label:'Timeline'}];
  return [{kind:'follow', label:'Follow card'}];
}

/* ---------- canvas helpers ---------- */
function drawCover(ctx, s, x, y, w, h){
  const im = imgOf(s); if (!im) return;
  const iw = im.naturalWidth || im.width, ih = im.naturalHeight || im.height;
  const sc = Math.max(w/iw, h/ih) * s.zoom, dw = iw*sc, dh = ih*sc;
  const ex = dw - w, ey = dh - h;
  ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  ctx.drawImage(im, x - ex*(s.ox+1)/2, y - ey*(s.oy+1)/2, dw, dh);
  ctx.restore();
}
function drawContain(ctx, im, cx, cy, mw, mh){
  const iw = im.naturalWidth || im.width, ih = im.naturalHeight || im.height;
  const sc = Math.min(mw/iw, mh/ih), w = iw*sc, h = ih*sc;
  ctx.drawImage(im, cx - w/2, cy - h/2, w, h);
  return {w,h};
}
function fadeBottom(ctx, y0, y1){
  const g = ctx.createLinearGradient(0,y0,0,y1);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(.45,'rgba(0,0,0,.55)'); g.addColorStop(.8,'rgba(0,0,0,.92)'); g.addColorStop(1,'#000');
  ctx.fillStyle = g; ctx.fillRect(0,y0,W,y1-y0);
  ctx.fillStyle = '#000'; ctx.fillRect(0,y1,W,H-y1);
}
function rrect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function shadowOn(ctx, b=14){ ctx.shadowColor='rgba(0,0,0,.55)'; ctx.shadowBlur=b; ctx.shadowOffsetY=2; }
function shadowOff(ctx){ ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0; }

// rich text: *stars* mark highlighted words, \n forces a break
function toks(text, upper=true){
  const out = [];
  (text||'').split('\n').forEach((line, li) => {
    if (li) out.push({br:true});
    line.split(/(\*[^*]+\*)/).forEach(part => {
      if (!part) return;
      const em = /^\*[^*]+\*$/.test(part);
      const s = em ? part.slice(1,-1) : part;
      s.split(/\s+/).filter(Boolean).forEach(t => out.push({t: upper ? t.toUpperCase() : t, em}));
    });
  });
  return out;
}
function wrap(ctx, tk, maxW){
  const sp = ctx.measureText(' ').width; const lines = [{w:0, words:[]}]; let over = false;
  for (const t of tk){
    if (t.br){ lines.push({w:0, words:[]}); continue; }
    const w = ctx.measureText(t.t).width; if (w > maxW) over = true;
    let L = lines[lines.length-1];
    if (L.words.length && L.w + sp + w > maxW){ L = {w:0, words:[]}; lines.push(L); }
    L.w += (L.words.length ? sp : 0) + w; L.words.push({...t, w});
  }
  return {lines: lines.filter(l=>l.words.length), sp, over};
}
const blockH = (n, size, lh) => size * (0.74 + (n-1)*lh);
function fitText(ctx, tk, fontFn, maxW, maxH, lh, maxS, minS=20){
  let res;
  for (let s = maxS; s >= minS; s -= 2){
    ctx.font = fontFn(s); res = wrap(ctx, tk, maxW); res.size = s;
    if (!res.over && blockH(res.lines.length, s, lh) <= maxH) return res;
  }
  return res;
}
function drawLines(ctx, res, cx, top, lh, color, emColor){
  res.lines.forEach((L, i) => {
    let x = cx - L.w/2; const y = top + res.size*0.74 + i*res.size*lh;
    L.words.forEach(wd => { ctx.fillStyle = wd.em ? emColor : color; ctx.textAlign='left'; ctx.fillText(wd.t, x, y); x += wd.w + res.sp; });
  });
}
function swipeTag(ctx, text, x, y){
  ctx.font = '900 34px Montserrat, Arial Black, sans-serif'; ctx.textAlign = 'right'; ctx.fillStyle = brand.accent; ctx.fillText(text, x, y);
}

/* ---------- slide renderers (each returns drag regions) ---------- */
function brandMark(ctx){
  if (brand.logo.img){ shadowOn(ctx,18); const im = brand.logo.img; const iw=im.naturalWidth, ih=im.naturalHeight; const sc=Math.min(300/iw, 86/ih); ctx.drawImage(im, 64, 70, iw*sc, ih*sc); shadowOff(ctx); return; }
  ctx.font = '900 64px Montserrat, Arial Black, sans-serif'; ctx.textAlign='left'; shadowOn(ctx,18);
  ctx.fillStyle = brand.accent; ctx.fillText((brand.name||'').toLowerCase(), 64, 134); shadowOff(ctx);
}
const R = {
  hlCover(ctx){
    const p = P.headline;
    drawCover(ctx, p.img, 0, 0, W, H);
    fadeBottom(ctx, H*0.5, H*0.71);
    if (p.logo) brandMark(ctx);
    if (p.swipe){
      shadowOn(ctx,16); ctx.font = '400 62px "Bebas Neue", Impact, sans-serif'; ctx.textAlign='right'; ctx.fillStyle='#fff';
      ctx.fillText('SWIPE LEFT', W-150, 136);
      ctx.strokeStyle='#fff'; ctx.lineWidth=5; ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.beginPath(); ctx.moveTo(W-66,112); ctx.lineTo(W-126,112); ctx.moveTo(W-108,94); ctx.lineTo(W-126,112); ctx.lineTo(W-108,130); ctx.stroke();
      shadowOff(ctx);
    }
    const lh = 1.1, fit = fitText(ctx, toks(p.text), s=>`900 ${s}px Montserrat, Arial Black, sans-serif`, W-150, H*0.27, lh, 96, 34);
    const top = H*0.715 + (H*0.27 - blockH(fit.lines.length, fit.size, lh))/2;
    drawLines(ctx, fit, W/2, top, lh, '#fff', brand.accent);
    return [{x:0,y:0,w:W,h:H,s:p.img}];
  },
  hlClean(ctx){ drawCover(ctx, P.headline.cleanAdj, 0, 0, W, H); return [{x:0,y:0,w:W,h:H,s:P.headline.cleanAdj}]; },
  listCover(ctx){
    const p = P.list, n = p.panelCount, gap = 6, top = H*0.72, pw = (W - gap*(n-1))/n, regs = [];
    ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
    for (let i=0;i<n;i++){ const x = i*(pw+gap); drawCover(ctx, p.panels[i], x, 0, pw, top); regs.push({x,y:0,w:pw,h:top,s:p.panels[i]}); }
    fadeBottom(ctx, top-260, top);
    const lh = 1.0, fit = fitText(ctx, toks(p.text), s=>`900 ${s}px Montserrat, Arial Black, sans-serif`, W-110, H*0.36, lh, 150, 40);
    const bottom = H - 120, bh = blockH(fit.lines.length, fit.size, lh);
    drawLines(ctx, fit, W/2, bottom - bh, lh, '#fff', brand.accent);
    if (p.swipe) swipeTag(ctx, 'SWIPE', W-70, H-50);
    return regs;
  },
  listItem(ctx, sl){
    const it = P.list.items[sl.i];
    drawCover(ctx, it.img, 0, 0, W, H);
    fadeBottom(ctx, H*0.6, H*0.78);
    const cy = it.showRating ? 1100 : 1150;
    if (it.logo.img){ shadowOn(ctx,24); drawContain(ctx, it.logo.img, W/2, cy, 640, 230); shadowOff(ctx); }
    else {
      const font = s => `${it.font==='Montserrat'?'900':it.font==='Cinzel'?'700':'400'} ${s}px "${it.font}"`;
      const lh = 0.98, fit = fitText(ctx, toks(it.title, it.font!=='Cinzel' ? false : true), font, 760, 230, lh, it.font==='Cinzel'?120:150, 30);

      h('p',{class:'note'},'The profile card uses your saved brand details. They are reused on every post.'),
      h('button',{class:'btn', type:'button', on:{click:()=>{ mode='brand'; buildPanel(); }}}, 'Edit profile and logo'));
  }
}
function buildBrand(panel){
  const sb = () => saveBrand();
  panel.append(h('div',{class:'ph'}, h('h2',{},'Brand & profile'), h('button',{class:'btn small primary', type:'button', on:{click:()=>{ mode='slide'; buildPanel(); }}},'Done')),
    h('p',{class:'note'},'Saved in this browser and used on every post.'),
    group('Page',
      textField('Page name', brand, 'name', {tip:'Shown top left on headline covers when there is no logo image.', onChange:sb}),
      slotUI('Logo image', brand.logo, {contain:true, empty:'Optional transparent PNG. Replaces the page name.'}),
      colorField('Theme color', brand, 'accent', () => { applyAccent(); sb(); })),
    group('Follow card profile',
      slotUI('Profile picture', brand.avatar, {empty:'Optional. Without one, your logo or page name is used.'}),
      textField('Display name', brand, 'display', {onChange:sb}),
      toggle('Blue tick', brand, 'verified', () => { sb(); schedule(); }),
      h('div',{class:'row'}, textField('Posts', brand,'posts',{onChange:sb}), textField('Followers', brand,'followers',{onChange:sb}), textField('Following', brand,'following',{onChange:sb})),
      textField('Bio', brand, 'bio', {area:true, tip:'One line per row, up to 5. @handles show in purple.', onChange:sb}),
      textField('Link', brand, 'link', {onChange:sb}),
      textField('Follow headline', brand, 'cta', {area:true, onChange:sb})));
}
function buildStrip(){
  const strip = $('#strip'); strip.replaceChildren();
  const sls = slidesFor();
  sls.forEach((sl,i) => {
    const c = h('canvas',{width:152, height:190});
    strip.append(h('button',{class:'thumb', type:'button', 'aria-current': i===sel ? 'true' : 'false', 'aria-label':`Slide ${i+1}: ${sl.label}`,
      on:{click:()=>{ sel=i; mode='slide'; buildStrip(); buildPanel(); schedule(); }}}, c, h('span',{}, `${i+1}. ${sl.label}`)));
  });
  if (fmt === 'list') strip.append(h('button',{class:'add', type:'button', on:{click:()=>{ P.list.items.push({img:slot(`movie ${P.list.items.length+1}`), logo:slot('title logo',{noPH:true,contain:true}), title:'', font:'Montserrat', color:'#ffffff', rating:'', showRating:true}); sel = P.list.items.length; mode='slide'; rebuild(); }}}, '+ Add movie'));
  if (fmt === 'news') strip.append(h('button',{class:'add', type:'button', on:{click:()=>{ P.news.stories.push({img:slot(`story ${P.news.stories.length+1}`), text:''}); sel = P.news.stories.length; mode='slide'; rebuild(); }}}, '+ Add story slide'));
}
function buildTabs(){
  const tabs = $('#tabs'); tabs.replaceChildren();
  FORMATS.forEach(f => tabs.append(h('button',{class:'tab', role:'tab', type:'button', 'aria-selected': f.id===fmt ? 'true':'false', on:{click:()=>{ fmt=f.id; sel=0; mode='slide'; buildTabs(); rebuild(); }}}, f.name)));
}

/* ---------- drag / zoom on preview ---------- */
const cv = $('#main'); let drag = null;
const toCanvas = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height, W / r.width]; };
const hit = (x,y) => [...regions].reverse().find(r => x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h);
function extents(reg){ const im = imgOf(reg.s); if (!im) return [0,0]; const iw = im.naturalWidth||im.width, ih = im.naturalHeight||im.height; const sc = Math.max(reg.w/iw, reg.h/ih) * reg.s.zoom; return [iw*sc - reg.w, ih*sc - reg.h]; }
cv.addEventListener('pointerdown', e => { const [x,y] = toCanvas(e); const reg = hit(x,y); if (!reg) return; drag = {reg, x, y}; cv.setPointerCapture(e.pointerId); $('#preview').classList.add('dragging'); });
cv.addEventListener('pointermove', e => { if (!drag) return; const [x,y] = toCanvas(e); const [ex,ey] = extents(drag.reg); const s = drag.reg.s;
  if (ex > 0) s.ox = Math.max(-1, Math.min(1, s.ox - 2*(x-drag.x)/ex));
  if (ey > 0) s.oy = Math.max(-1, Math.min(1, s.oy - 2*(y-drag.y)/ey));
  drag.x = x; drag.y = y; schedule(); });
const endDrag = () => { drag = null; $('#preview').classList.remove('dragging'); };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('wheel', e => { const [x,y] = toCanvas(e); const reg = hit(x,y); if (!reg) return; e.preventDefault();
  reg.s.zoom = Math.max(1, Math.min(3, reg.s.zoom * (e.deltaY < 0 ? 1.06 : 1/1.06))); schedule(); }, {passive:false});
cv.addEventListener('dragover', e => e.preventDefault());
cv.addEventListener('drop', e => { e.preventDefault(); const [x,y] = toCanvas(e); const reg = hit(x,y) || regions[0]; if (!reg) return; const s = reg.s.srcSlot || reg.s; loadFile(e.dataTransfer.files[0], s, () => { buildPanel(); }); });
document.addEventListener('paste', e => {
  const item = [...(e.clipboardData?.items||[])].find(i => i.type.startsWith('image/')); if (!item) return;
  e.preventDefault();
  const target = activeSlot || (regions[0] && (regions[0].s.srcSlot || regions[0].s)); if (!target) return toast('Click a photo box first, then paste.');
  loadFile(item.getAsFile(), target, () => buildPanel());
});

/* ---------- brand persistence ---------- */
function applyAccent(){ document.documentElement.style.setProperty('--accent', brand.accent); }
let saveT = 0;
function saveBrand(){ clearTimeout(saveT); saveT = setTimeout(() => {
  const data = {...brand, logo: brand.logo.src, avatar: brand.avatar.src};
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
  catch { try { localStorage.setItem(STORE_KEY, JSON.stringify({...data, logo:null, avatar:null})); toast('Logo images are too large to remember. Text settings were saved.'); } catch {} }
}, 400); }
function loadBrand(){
  let d; try { d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch { d = null; }
  if (!d) return;
  ['name','accent','display','verified','posts','followers','following','bio','link','cta'].forEach(k => { if (d[k] !== undefined) brand[k] = d[k]; });
  [['logo',brand.logo],['avatar',brand.avatar]].forEach(([k,s]) => { if (d[k]){ const im = new Image(); im.onload = () => { s.img = im; s.src = d[k]; s._refresh && s._refresh(); schedule(); }; im.src = d[k]; } });
}

/* ---------- export ---------- */
let downloads = null;
const CRC = (() => { const t = new Uint32Array(256); for (let n=0;n<256;n++){ let c=n; for (let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for (let i=0;i<b.length;i++) c = CRC[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
function zip(files){
  const enc = new TextEncoder(), parts = [], central = []; let offset = 0;
  const d = new Date(), time = (d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1), date = ((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for (const f of files){
    const name = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0,true); lh.setUint16(8,0,true); lh.setUint16(10,time,true); lh.setUint16(12,date,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,sz,true); lh.setUint32(22,sz,true); lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(lh, name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0,true); ch.setUint16(10,0,true); ch.setUint16(12,time,true); ch.setUint16(14,date,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,sz,true); ch.setUint32(24,sz,true); ch.setUint16(28,name.length,true); ch.setUint32(42,offset,true);
    central.push(ch, name); offset += 30 + name.length + sz;
  }
  const cdSize = central.reduce((a,p)=>a+(p.byteLength ?? p.length),0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true); end.setUint32(12,cdSize,true); end.setUint32(16,offset,true);
  return new Blob([...parts, ...central, end], {type:'application/zip'});
}
const slideBlob = sl => new Promise(res => { const c = document.createElement('canvas'); c.width=W; c.height=H; renderSlide(c.getContext('2d'), sl); c.toBlob(res, 'image/png'); });
async function saveFile(filename, data){
  if (!downloads) return toast('Saving is not available in this view. Right-click the big preview and choose "Save image".');
  try { await downloads.save({filename, data}); toast('Saved'); }
  catch (e) { toast(e && e.code === 'declined' ? 'Download cancelled' : e && e.code === 'rate_limited' ? 'A save is already waiting for you to confirm.' : 'Could not save the file. Try again.'); }
}
$('#saveAll').addEventListener('click', async () => {
  const btn = $('#saveAll'); btn.disabled = true; const old = btn.textContent; btn.textContent = 'Preparing…';
  try {
    const sls = slidesFor(), stamp = new Date().toISOString().slice(0,10), base = `${(brand.name||'post').replace(/[^\w-]+/g,'')}-${fmt}-${stamp}`;
    if (sls.length === 1){ await saveFile(`${base}.png`, await slideBlob(sls[0])); }
    else {
      const files = [];
      for (let i=0;i<sls.length;i++){ const b = await slideBlob(sls[i]); files.push({name:`${String(i+1).padStart(2,'0')}-${sls[i].label.replace(/[^\w-]+/g,'-').toLowerCase()}.png`, data:new Uint8Array(await b.arrayBuffer())}); }
      await saveFile(`${base}.zip`, zip(files));
    }
  } finally { btn.disabled = false; btn.textContent = old; }
});
$('#brandBtn').addEventListener('click', () => { mode = mode === 'brand' ? 'slide' : 'brand'; buildPanel(); });

let toastT = 0;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }

/* ---------- boot ---------- */
loadBrand(); applyAccent(); buildTabs(); rebuild();
Promise.all(['900 60px Montserrat, Arial Black, sans-serif','800 60px Montserrat, Arial Black, sans-serif','400 60px Anton, Impact, sans-serif','400 60px "Bebas Neue", Impact, sans-serif','700 60px Cinzel, Georgia, serif','400 30px Archivo, Arial, sans-serif','600 30px Archivo, Arial, sans-serif','700 30px Archivo, Arial, sans-serif'].map(f => document.fonts.load(f).catch(()=>{})))
  .then(() => document.fonts.ready).then(schedule);
(async () => { try { if (window.claude && window.claude.use) downloads = await window.claude.use('downloads'); } catch { downloads = null; } })();
</script>
